<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EV Sales Explorer</title>

  <link rel="stylesheet" href="../css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
  <!-- HERO -->
  <section class="hero section">
    <div class="hero-content container">
      <div>
        <h1>EV Sales Explorer</h1>
        <p class="subtitle">Explore EV sales trends, growth, and comparisons over time</p>

        <nav class="nav" aria-label="Primary navigation">
          <a href="../index.html">Dashboard</a>
          <a href="./ev-share.html">EV Share Explorer</a>
          <a href="./ev-sales.html" aria-current="page">EV Sales Explorer</a>
          <a href="./oil-info.html">Oil Import/Export Explorer</a>
          <a href="./data.html">Data Set Explorer</a>
          <a href="../index.html#about">About</a>
        </nav>
      </div>
    </div>
  </section>

  <main class="container">
    <!-- Controls -->
    <section class="card" aria-label="EV sales controls">
      <div class="toolbar">
        <div class="toolbar-left">
          <label for="countrySelect" class="label">Country</label>
          <select id="countrySelect" class="select"></select>
        </div>

        <div class="toolbar-left">
          <label for="metricSelect" class="label">Metric</label>
          <select id="metricSelect" class="select">
            <option value="ev_sales" selected>EV Sales</option>
            <option value="ev_sales_growth">EV Sales Growth (%)</option>
            <option value="ev_share">EV Share (%)</option>
          </select>
        </div>

        <div class="toolbar-right">
          <div class="meta">
            <div class="meta-title" id="metaTitle">EV Sales Trend</div>
            <div class="meta-sub" id="metaSub">Select a country to begin</div>
          </div>
        </div>
      </div>

      <p class="hint" id="dataHint"></p>
    </section>

    <!-- Trend chart -->
    <section class="card" aria-label="EV sales chart">
      <div id="chart" class="chart" role="img" aria-label="EV sales trend chart"></div>
      <div id="emptyState" class="empty" hidden>No data available for this selection.</div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="copyright-text">&copy; <span id="year"></span> Energy Dashboard</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script type="module" src="../js/ev-sales.js"></script>
</body>
</html>
