<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Energy Dashboard | Oil ARIMA Forecasts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1115; --surface: #181a1f; --surface-light: #22252b;
      --accent: #3b82f6; --text: #f1f5f9; --text-muted: #94a3b8; --text-dim: #64748b;
      --border: #2d3139; --border-light: #3e4451;
      --green: #10b981; --red: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif;
      margin: 0; line-height: 1.5; overflow-x: hidden;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    
    /* Header & Filters */
    header { padding: 40px 0; border-bottom: 1px solid var(--border); background: var(--surface); }
    .controls { display: flex; gap: 16px; margin-top: 24px; flex-wrap: wrap; }
    select {
      background: var(--bg); color: var(--text); border: 1px solid var(--border-light);
      padding: 10px 16px; border-radius: 8px; font-size: 0.9rem; cursor: pointer;
    }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin: 32px 0; }
    .stat-card { background: var(--surface); padding: 24px; border-radius: 12px; border: 1px solid var(--border); }
    .stat-label { color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 8px; }
    .stat-value { font-size: 1.5rem; font-weight: 700; margin: 0; }
    .stat-sub { font-family: 'Space Mono', monospace; font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }

    /* Chips */
    .chip-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; align-items: center; }
    .chip-action { background: none; border: 1px solid var(--border-light); color: var(--text-muted); padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; transition: 0.2s; }
    .chip-action:hover { background: var(--surface-light); color: var(--text); }
    .country-chip {
      display: flex; align-items: center; gap: 8px; background: var(--surface);
      border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px;
      font-size: 0.85rem; cursor: pointer; transition: 0.2s; color: var(--text-muted);
    }
    .country-chip.active { border-color: var(--chip-c); color: var(--text); background: rgba(from var(--chip-c) r g b / 0.1); }
    .chip-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* Chart */
    #chart-wrapper { background: var(--surface); border-radius: 16px; border: 1px solid var(--border); padding: 32px; position: relative; }
    .tooltip {
      position: absolute; background: rgba(15, 17, 21, 0.95); border: 1px solid var(--border-light);
      padding: 12px; border-radius: 8px; pointer-events: none; display: none; z-index: 100;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); min-width: 140px;
    }

    /* Table */
    .table-container { margin-top: 40px; overflow-x: auto; background: var(--surface); border-radius: 12px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 16px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; }
    td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    .td-mono { font-family: 'Space Mono', monospace; }
    .mape-bad { color: var(--red); }
    .mape-good { color: var(--green); }
  </style>
</head>
<body>

  <header>
    <div class="wrap">
      <h1 id="metaTitle" style="margin:0">Loading Dashboard...</h1>
      <p id="metaSub" style="color:var(--text-dim); margin:4px 0 0">Synchronizing with JODI Data Sources</p>
      
      <div class="controls">
        <select id="viewSelect">
          <option value="exports">Crude Oil Exports</option>
          <option value="imports">Crude Oil Imports</option>
          <option value="net">Net Trade Balance</option>
        </select>
        <select id="yearSelect"></select>
      </div>
    </div>
  </header>

  <main class="wrap" style="margin-top: 32px; margin-bottom: 80px;">
    <div id="statsGrid" class="stats-grid"></div>

    <div class="chip-container">
      <button id="chipAll" class="chip-action">Select All</button>
      <button id="chipClear" class="chip-action">Clear</button>
      <div id="chipRow" style="display:flex; flex-wrap:wrap; gap:8px; margin-left:12px"></div>
    </div>

    <div id="chart-wrapper">
      <div id="chart"></div>
      <div id="tooltip" class="tooltip"></div>
    </div>

    <div class="table-container">
      <table id="summaryTable"></table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    (async function() {
      "use strict";

      // --- Configuration ---
      const COLORS = ["#3b82f6", "#10b981", "#f59e0b", "#ef4444", "#8b5cf6", "#ec4899", "#06b6d4", "#f97316"];
      const MARGIN = { top: 40, right: 30, bottom: 60, left: 60 };
      const TOTAL_H = 500;
      
      // --- State ---
      let datasets = { exports: [], imports: [], net: [] };
      let allData = [];
      let active = [];
      let view = "exports";
      let startYear = 1971;

      // ── Data Loading Logic ────────────────────────────────────────────────
      async function loadFiles() {
        try {
          const [exRaw, imRaw, netRaw] = await Promise.all([
            d3.csv("data/export.csv"),
            d3.csv("data/oil-forecast.csv"),
            d3.csv("data/net_trade.csv").catch(() => []) 
          ]);

          datasets.exports = parseCSV(exRaw);
          datasets.imports = parseCSV(imRaw);
          
          if (netRaw.length > 0) {
            datasets.net = parseCSV(netRaw);
          } else {
            // Generate Net Trade if file missing
            datasets.net = datasets.exports.map(ex => {
              const im = datasets.imports.find(i => i.country === ex.country);
              if (!im) return null;
              return {
                ...ex,
                history: ex.history.map(h => ({ year: h.year, value: h.value - (im.history.find(p=>p.year===h.year)?.value || 0) })),
                forecast: ex.forecast.map(f => ({ year: f.year, value: f.value - (im.forecast.find(p=>p.year===f.year)?.value || 0) })),
                conf_int: []
              };
            }).filter(Boolean);
          }
          
          initDashboard();
        } catch (err) {
          document.getElementById("metaTitle").textContent = "Connection Error";
          document.getElementById("chart").innerHTML = `<p style="color:var(--red)">Check /data/ folder for CSV files and run on a local server.</p>`;
        }
      }

      function parseCSV(data) {
        const names = [...new Set(data.map(d => d.Country))];
        return names.map((name, i) => {
          const rows = data.filter(d => d.Country === name);
          const isHist = (t) => t.toLowerCase().startsWith("hist");
          return {
            country: name,
            color: COLORS[i % COLORS.length],
            order: rows.find(r => r.ARIMA_Order)?.ARIMA_Order || "—",
            mape: rows.find(r => r.MAPE)?.MAPE ? +rows.find(r => r.MAPE).MAPE : null,
            history: rows.filter(r => isHist(r.Type)).map(r => ({ year: +r.Year, value: +r.Value })).sort((a,b)=>a.year-b.year),
            forecast: rows.filter(r => !isHist(r.Type)).map(r => ({ year: +r.Year, value: +r.Value })).sort((a,b)=>a.year-b.year),
            conf_int: rows.filter(r => !isHist(r.Type)).map(r => ({ year: +r.Year, lower: +r.Lower_CI, upper: +r.Upper_CI })).sort((a,b)=>a.year-b.year)
          };
        });
      }

      // ── Core Rendering ───────────────────────────────────────────────────
      function render() {
        const filtered = allData.filter(d => active.includes(d.country));
        const chartDiv = document.getElementById("chart");
        const TOTAL_W = chartDiv.clientWidth;
        const W = TOTAL_W - MARGIN.left - MARGIN.right;
        const H = TOTAL_H - MARGIN.top - MARGIN.bottom;

        chartDiv.innerHTML = "";
        const svg = d3.select(chartDiv).append("svg")
          .attr("viewBox", `0 0 ${TOTAL_W} ${TOTAL_H}`)
          .on("mousemove", (e) => onHover(e, filtered, xScale, yScale))
          .on("mouseleave", () => d3.select("#tooltip").style("display", "none"));

        const g = svg.append("g").attr("transform", `translate(${MARGIN.left},${MARGIN.top})`);

        // Scales
        const allPoints = filtered.flatMap(d => [...d.history, ...d.forecast].filter(p => p.year >= startYear));
        if (!allPoints.length) return;

        const xScale = d3.scaleLinear().domain([startYear, 2031]).range([0, W]);
        const yScale = d3.scaleLinear().domain([
            d3.min(allPoints, p => p.value) < 0 ? d3.min(allPoints, p => p.value) * 1.1 : 0, 
            d3.max(allPoints, p => p.value) * 1.15
        ]).range([H, 0]);

        // Axes
        g.append("g").attr("transform", `translate(0,${H})`).call(d3.axisBottom(xScale).tickFormat(d3.format("d")).tickSizeOuter(0));
        g.append("g").call(d3.axisLeft(yScale).ticks(6).tickSize(-W)).call(g => g.select(".domain").remove())
         .call(g => g.selectAll(".tick line").attr("stroke", "var(--border)").attr("stroke-dasharray", "2,2"));

        // Forecast Shade
        const divX = xScale(2024);
        g.append("rect").attr("x", divX).attr("width", W - divX).attr("height", H).attr("fill", "white").attr("opacity", 0.03);

        const line = d3.line().x(d => xScale(d.year)).y(d => yScale(d.value));

        filtered.forEach(d => {
          // CI Area
          if (d.conf_int.length) {
            const area = d3.area().x(p => xScale(p.year)).y0(p => yScale(p.lower)).y1(p => yScale(p.upper));
            g.append("path").datum(d.conf_int).attr("d", area).attr("fill", d.color).attr("opacity", 0.1);
          }
          // History
          g.append("path").datum(d.history.filter(p => p.year >= startYear))
            .attr("d", line).attr("fill", "none").attr("stroke", d.color).attr("stroke-width", 2.5);
          // Forecast
          const combined = [d.history.at(-1), ...d.forecast].filter(Boolean);
          g.append("path").datum(combined)
            .attr("d", line).attr("fill", "none").attr("stroke", d.color).attr("stroke-width", 2.5).attr("stroke-dasharray", "5,5");
        });

        updateTable(filtered);
        updateStats(filtered);
      }

      function onHover(event, data, x, y) {
        const [mx] = d3.pointer(event, document.getElementById("chart").querySelector("svg"));
        const year = Math.round(x.invert(mx - MARGIN.left));
        const tip = d3.select("#tooltip");
        
        const matches = data.map(d => {
          const pt = [...d.history, ...d.forecast].find(p => p.year === year);
          return pt ? { name: d.country, val: pt.value, color: d.color } : null;
        }).filter(Boolean).sort((a,b) => b.val - a.val);

        if (!matches.length) return tip.style("display", "none");

        tip.style("display", "block").style("left", (event.pageX + 15) + "px").style("top", (event.pageY - 20) + "px")
           .html(`<div style="font-weight:700;margin-bottom:8px">${year}</div>` + 
             matches.map(m => `<div style="display:flex;justify-content:space-between;gap:20px;font-size:0.8rem">
               <span><span style="color:${m.color}">●</span> ${m.name}</span>
               <span style="font-family:Space Mono">${Math.round(m.val).toLocaleString()}</span>
             </div>`).join(""));
      }

      function updateTable(data) {
        const container = document.getElementById("summaryTable");
        container.innerHTML = `<thead><tr><th>Country</th><th>2023 Value</th><th>2031 FC</th><th>ARIMA</th><th>MAPE</th></tr></thead>
          <tbody>${data.map(d => `
            <tr>
              <td><span style="color:${d.color}">●</span> ${d.country}</td>
              <td class="td-mono">${Math.round(d.history.at(-1)?.value || 0).toLocaleString()}</td>
              <td class="td-mono">${Math.round(d.forecast.at(-1)?.value || 0).toLocaleString()}</td>
              <td class="td-mono" style="font-size:0.75rem">${d.order}</td>
              <td class="td-mono ${d.mape > 15 ? 'mape-bad' : 'mape-good'}">${d.mape ? d.mape.toFixed(1) + '%' : '—'}</td>
            </tr>`).join("")}</tbody>`;
      }

      function updateStats(data) {
        if (!data.length) return;
        const top = [...data].sort((a,b) => (b.history.at(-1)?.value || 0) - (a.history.at(-1)?.value || 0))[0];
        document.getElementById("statsGrid").innerHTML = `
          <div class="stat-card"><p class="stat-label">Market Leader</p><p class="stat-value">${top.country}</p><p class="stat-sub">Top current volume</p></div>
          <div class="stat-card"><p class="stat-label">Model Precision</p><p class="stat-value">${(data.reduce((a,b)=>a+(b.mape||0),0)/data.length).toFixed(1)}%</p><p class="stat-sub">Avg. MAPE Error</p></div>
          <div class="stat-card"><p class="stat-label">Horizon</p><p class="stat-value">2031</p><p class="stat-sub">Log-ARIMA Target Year</p></div>`;
        document.getElementById("metaTitle").textContent = `Crude Oil ${view.charAt(0).toUpperCase() + view.slice(1)} (KBD)`;
      }

      // ── UI Helpers ───────────────────────────────────────────────────────
      function buildChips() {
        const row = document.getElementById("chipRow");
        row.innerHTML = "";
        allData.forEach(d => {
          const chip = document.createElement("div");
          chip.className = `country-chip ${active.includes(d.country) ? 'active' : ''}`;
          chip.style.setProperty("--chip-c", d.color);
          chip.innerHTML = `<span class="chip-dot" style="background:${d.color}"></span>${d.country}`;
          chip.onclick = () => {
            active = active.includes(d.country) ? active.filter(c => c !== d.country) : [...active, d.country];
            buildChips(); render();
          };
          row.appendChild(chip);
        });
      }

      function initDashboard() {
        allData = datasets[view];
        active = allData.map(d => d.country);
        
        // Populate Year Select
        const yrs = [1971, 1980, 1990, 2000, 2010, 2020];
        const ys = document.getElementById("yearSelect");
        yrs.forEach(y => {
          const opt = document.createElement("option");
          opt.value = y; opt.textContent = "From " + y;
          ys.appendChild(opt);
        });

        ys.onchange = (e) => { startYear = +e.target.value; render(); };
        document.getElementById("chipAll").onclick = () => { active = allData.map(d => d.country); buildChips(); render(); };
        document.getElementById("chipClear").onclick = () => { active = []; buildChips(); render(); };
        
        buildChips();
        render();
      }

      window.addEventListener("resize", render);
      document.getElementById("viewSelect").onchange = (e) => {
        view = e.target.value;
        allData = datasets[view];
        active = allData.map(d => d.country);
        buildChips(); render();
      };

      loadFiles();
    })();
  </script>
</body>
</html>
